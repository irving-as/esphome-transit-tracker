esphome:
  name: transit-tracker-s3
  friendly_name: Transit Tracker

esp32:
  variant: esp32s3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

psram:
  mode: quad
  speed: 80MHz

external_components:
  - source:
      type: local
      path: ../components

logger:
  level: DEBUG
  logs:
    sensor: ERROR
    text_sensor: ERROR

ota:
  - platform: esphome
    password: ""

wifi:
  ssid: "ReplaceMe"
  password: "ReplaceMe!"
  power_save_mode: "NONE"

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "TransitTracker Fallback Hotspot"
    password: "59541bEJiaf3"

display:
  - platform: hub75
    id: matrix
    board: adafruit-matrix-portal-s3
    double_buffer: true
    update_interval: 32ms
    panel_width: 64
    panel_height: 32
    layout_cols: 2
    # We swap the G and B channels in firmware because the 64x32 panel hardware has them reversed
    g1_pin: 40
    b1_pin: 41
    g2_pin: 37
    b2_pin: 39
    e_pin: 21
    brightness: 255
    lambda: |-
      id(tracker).draw_schedule();

font:
  - file: "fonts/Pixolletta8px.ttf"
    id: pixolletta
    size: 10
    glyphs:
      - abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.,:;!?()"'-+/*=%@#[]{}<>|&^~
      - " "

time:
  - platform: sntp
    id: sntp_time
    timezone: America/Los_Angeles

color:
  - id: rapidride_red
    hex: "F50046"

# Runtime-adjustable settings exposed to Home Assistant via the ESPHome API.
# Changes persist across reboots and take effect immediately.
number:
  - platform: template
    name: "Display Brightness"
    id: display_brightness
    icon: mdi:brightness-6
    min_value: 0
    max_value: 255
    step: 1
    optimistic: true
    initial_value: 255
    restore_value: true
    set_action:
      - hub75.set_brightness:
          id: matrix
          brightness: !lambda "return (uint8_t) x;"

  - platform: template
    name: "Arrival Time Window"
    id: arrival_time_window
    icon: mdi:clock-outline
    unit_of_measurement: min
    min_value: 0
    max_value: 180
    step: 1
    optimistic: true
    initial_value: 30
    restore_value: true
    set_action:
      - transit_tracker.set_arrival_time_window:
          id: tracker
          arrival_time_window: !lambda "return (int) x;"

select:
  - platform: template
    name: "Page Transition"
    id: page_transition
    icon: mdi:animation-outline
    optimistic: true
    initial_option: "fade"
    restore_value: true
    options:
      - none
      - fade
      - scroll
    set_action:
      - transit_tracker.set_page_transition:
          id: tracker
          page_transition: !lambda "return x;"

transit_tracker:
  id: tracker
  base_url: "wss://tt.horner.tj/"
  limit: 3
  feed_code: "st"
  arrival_time_window: 30
  page_transition: fade
  page_duration: 5000
  transition_duration: 700
  stops:
    - stop_id: "1_71971" # Redmond Way & Bear Creek Pkwy
      time_offset: -8min
      routes:
        - "1_100113" # 221
        - "1_102704" # 250
    - stop_id: "1_71961" # RTC
      time_offset: -10min
      routes:
        - "1_102548" # B Line
  styles:
    - route_id: "1_102548"
      name: "B"
      color: rapidride_red
  abbreviations:
    - from: "Bellevue Transit Center Crossroads"
      to: "Bellevue TC"
    - from: "Transit Center"
      to: "TC"
